[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-samples-tokenlens"
version = "0.2.0"
description = "Intelligent token optimization layer for LLM development workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [{ name = "AWS Professional Services" }]
maintainers = [{ name = "AWS Professional Services" }]
keywords = ["llm", "mcp", "token-optimization", "kiro", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # Exact versions keep standalone CLI, MCP server, and SDK behavior reproducible.
    # constraints-release.txt also constrains isolated build and release tooling.
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "click==8.4.2",
]

[project.urls]
Homepage = "https://github.com/aws-samples/sample-tokenlens"
Documentation = "https://github.com/aws-samples/sample-tokenlens#readme"
Source = "https://github.com/aws-samples/sample-tokenlens"
Issues = "https://github.com/aws-samples/sample-tokenlens/issues"
Changelog = "https://github.com/aws-samples/sample-tokenlens/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Ranges, not exact pins: an exact `mcp` pin caused a FastMCP import failure on
# fresh machines whose resolver had already selected a different compatible
# version. SUPPORTED INSTALL PATH: these extras are supported only when
# installed with constraints-release.txt applied (as README, RELEASING.md, and
# scripts/install-kiro.sh do), which pins every dependency to the exact
# release-validated version. An unconstrained install resolves the latest
# in-range versions and is not a validated configuration.
tokenizers = ["tiktoken>=0.6"]
mcp = ["mcp>=1.2,<2"]
dev = [
    "build==1.2.2.post1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "hypothesis==6.165.10",
    "ruff==0.16.3",
]

[project.scripts]
tokenlens = "tokenlens.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tokenlens.resources" = ["kiro/*.md", "fixtures/*.json", "*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
