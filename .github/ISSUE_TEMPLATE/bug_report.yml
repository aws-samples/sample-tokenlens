name: Bug report
description: Report reproducible incorrect behavior in TokenLens
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Follow SECURITY.md for private reporting.
        Remove credentials, customer data, and confidential content from examples and logs.
  - type: input
    id: version
    attributes:
      label: TokenLens version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Release installer
        - uv tool
        - pipx
        - Editable source checkout
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Python version, and MCP client
      placeholder: macOS arm64, Python 3.12, Kiro CLI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable example using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized errors or logs where useful.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, customer data, and confidential content.
          required: true
        - label: This is not a security vulnerability.
          required: true
